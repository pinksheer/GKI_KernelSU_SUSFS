name: Google GKI 5.10.236 (patches only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android 12 Google GKI 5.10.236
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KERNEL_BRANCH: android12-5.10-2025-05
      KERNEL_VERSION: 5.10.236
      KERNEL_RELEASE: 5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
      BUILD_TIMESTAMP: Tue Oct 21 03:03:12 UTC 2025

    steps:
      - name: Checkout build scripts and patches
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libelf-dev libncurses-dev libssl-dev lz4 python3

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync official Google GKI source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"
          repo init --depth=1 \
            -u https://android.googlesource.com/kernel/manifest \
            -b "common-${KERNEL_BRANCH}" \
            --repo-rev=v2.16

          manifest="$PWD/.repo/manifests/default.xml"
          if grep -q 'path="common".*revision="' "$manifest"; then
            sed -i '/path="common"/ s|revision="android12-5.10-2025-05"|revision="deprecated/android12-5.10-2025-05"|' "$manifest"
          fi

          repo sync -c -j4 --jobs-checkout=4 --no-tags --no-clone-bundle --retry-fetches=3
          actual_version="$(awk -F ' = ' '/^VERSION = / {v=$2} /^PATCHLEVEL = / {p=$2} /^SUBLEVEL = / {s=$2} END {print v "." p "." s}' common/Makefile)"
          if [[ "$actual_version" != "$KERNEL_VERSION" ]]; then
            echo "::error::Expected $KERNEL_VERSION, got $actual_version"
            exit 1
          fi
          echo "Verified official kernel source version: $actual_version"

      - name: Apply the two requested patches
        working-directory: kernel/common
        run: |
          set -euo pipefail
          for patch_file in \
            "$GITHUB_WORKSPACE/unicode_bypass_fix_6.1-.patch" \
            "$GITHUB_WORKSPACE/gki_ptrace.patch"; do
            echo "Checking $patch_file"
            patch --dry-run --batch --forward --fuzz=0 -p1 < "$patch_file"
            patch --batch --forward --fuzz=0 -p1 < "$patch_file"
          done

      - name: Set the requested kernel build timestamp
        working-directory: kernel/common
        run: |
          set -euo pipefail
          export KBUILD_BUILD_TIMESTAMP="$BUILD_TIMESTAMP"
          export KBUILD_BUILD_VERSION=1

          file=scripts/mkcompile_h
          if [[ ! -f "$file" ]]; then
            echo "::error::Missing $file"
            exit 1
          fi
          perl -pi -e 's{UTS_VERSION="\$\(echo \$UTS_VERSION \$CONFIG_FLAGS \$TIMESTAMP \| cut -b -\$UTS_LEN\)"}{UTS_VERSION="#1 SMP PREEMPT Tue Oct 21 03:03:12 UTC 2025"}' "$file"
          if ! grep -Fq 'UTS_VERSION="#1 SMP PREEMPT Tue Oct 21 03:03:12 UTC 2025"' "$file"; then
            echo "::error::Could not set the requested UTS_VERSION in $file"
            exit 1
          fi
          echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: Set the requested kernel release name
        working-directory: kernel/common
        run: |
          set -euo pipefail
          file=scripts/setlocalversion
          if [[ ! -f "$file" ]]; then
            echo "::error::Missing $file"
            exit 1
          fi

          sed -i 's/-dirty//g' "$file"
          perl -0pi -e 's/echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/echo "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"/g; s/echo "\$res"/echo "5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284"/g' "$file"

          if ! grep -Fq '5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284' "$file"; then
            echo "::error::Could not set the requested kernel release in $file"
            exit 1
          fi
          echo "Kernel release will be: $KERNEL_RELEASE"

      - name: Build Google GKI kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Verify and collect Image
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/kernel/out/android12-5.10/dist/Image"
          if [[ ! -s "$image" ]]; then
            echo "::error::Build did not produce a non-empty Image at $image"
            find "$GITHUB_WORKSPACE/kernel/out" -maxdepth 5 -type f \( -name Image -o -name kernel.release -o -name utsrelease.h \) -print 2>/dev/null || true
            exit 1
          fi

          image_strings="$(strings "$image")"
          release_line="$(grep -F 'Linux version ' <<< "$image_strings" | head -n 1 || true)"
          timestamp_line="$(grep -F '#1 SMP PREEMPT ' <<< "$image_strings" | head -n 1 || true)"
          echo "Embedded release: ${release_line:-<not found>}"
          echo "Embedded build timestamp: ${timestamp_line:-<not found>}"

          if [[ "$release_line" != *"Linux version $KERNEL_RELEASE "* && "$release_line" != *"Linux version $KERNEL_RELEASE("* ]]; then
            echo "::error::Expected release '$KERNEL_RELEASE'; inspect the embedded release shown above."
            find "$GITHUB_WORKSPACE/kernel" -type f \( -path '*/include/config/kernel.release' -o -path '*/include/generated/utsrelease.h' \) -print -exec cat {} \; 2>/dev/null || true
            exit 1
          fi
          if [[ "$timestamp_line" != *'#1 SMP PREEMPT Tue Oct 21 03:03:12 UTC 2025'* ]]; then
            echo "::error::The embedded build timestamp does not match the requested value."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$image" "$GITHUB_WORKSPACE/artifacts/Image-$KERNEL_RELEASE"

      - name: Upload kernel Image
        uses: actions/upload-artifact@v6
        with:
          name: android12-5.10.236-google-gki
          path: artifacts/Image-5.10.236-android12-9-00003-gfb24cf99ad97-ab14313284
          if-no-files-found: error
          compression-level: 0
